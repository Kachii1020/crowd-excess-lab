name: Crowd Excess Agent

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Execution mode (live trading does not exist)
        required: true
        default: shadow
        type: choice
        options:
          - shadow
          - paper
  schedule:
    # Alpaca's market clock remains the final gate. This window covers US regular
    # hours during daylight saving time with a buffer for clock transitions.
    - cron: "*/15 13-20 * * 1-5"

permissions:
  contents: read

concurrency:
  group: crowd-excess-paper-agent
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: alpaca-paper
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-5.6-terra
      NAVER_API_HUB_CLIENT_ID: ${{ secrets.NAVER_API_HUB_CLIENT_ID }}
      NAVER_API_HUB_CLIENT_SECRET: ${{ secrets.NAVER_API_HUB_CLIENT_SECRET }}
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      ALPACA_COMPETITION_ACCOUNT_ID: ${{ secrets.ALPACA_COMPETITION_ACCOUNT_ID }}
      ALPACA_PAPER_BASE_URL: https://paper-api.alpaca.markets
      ALPACA_MARKET_DATA_URL: https://data.alpaca.markets
      ALPACA_LIVE_TRADE: "false"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      AGENT_MODE: ${{ github.event.inputs.mode || vars.AGENT_MODE || 'shadow' }}
      AUTO_PAPER_ON_APPROVED_SHADOW: ${{ vars.AUTO_PAPER_ON_APPROVED_SHADOW || 'false' }}
      AGENT_FREEZE_AT: "2026-09-03T20:00:00+00:00"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Install locked Python dependencies
        run: uv sync --locked --no-editable

      - name: Set up Go for the Alpaca CLI
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: false

      - name: Install pinned Alpaca CLI
        run: go install github.com/alpacahq/cli/cmd/alpaca@v0.0.13

      - name: Verify paper boundary
        run: |
          alpaca version
          uv run --no-sync crowd-excess-agent status

      - name: Run competition-window scan
        shell: bash
        run: |
          set -euo pipefail
          current_time="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          competition_window="true"
          if [[ "$current_time" < "2026-08-28T15:00:00Z" || "$current_time" > "2026-09-04T15:00:00Z" ]]; then
            competition_window="false"
            if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$AGENT_MODE" == "shadow" ]]; then
              echo "Outside the competition window; allowing an explicit shadow-only verification."
            else
              echo "Outside the declared competition window; no scan was attempted."
              exit 0
            fi
          fi

          if [[ "$AGENT_MODE" != "shadow" && "$AGENT_MODE" != "paper" ]]; then
            echo "Unsupported execution mode; live trading does not exist."
            exit 1
          fi

          # Preserve explicit/manual and configured paper semantics. The runner still
          # revalidates the paper endpoint, account, clock, data, and every risk gate.
          if [[ "$AGENT_MODE" == "paper" ]]; then
            uv run --no-sync crowd-excess-agent run
            exit 0
          fi

          clock_output="$RUNNER_TEMP/alpaca-clock.json"
          shadow_output="$RUNNER_TEMP/agent-shadow.json"
          paper_output="$RUNNER_TEMP/agent-paper.json"

          # The probe is intentionally not printed because it contains the account ID.
          uv run --no-sync crowd-excess-agent probe > "$clock_output"
          AGENT_MODE=shadow uv run --no-sync crowd-excess-agent run > "$shadow_output"
          cat "$shadow_output"

          if [[ "$competition_window" != "true" ]]; then
            echo "Paper promotion is disabled outside the declared competition window."
            exit 0
          fi

          promote="$(uv run --no-sync python scripts/auto_paper_gate.py \
            --shadow-output "$shadow_output" \
            --clock-output "$clock_output" \
            --enabled "$AUTO_PAPER_ON_APPROVED_SHADOW")"
          if [[ "$promote" != "true" ]]; then
            echo "One-shot paper promotion was not approved."
            exit 0
          fi

          echo "Approved shadow candidate found; starting one independent paper revalidation."
          AGENT_MODE=paper uv run --no-sync crowd-excess-agent run > "$paper_output"
          cat "$paper_output"
